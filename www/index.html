<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Balloon Pop! ABC & 123</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #56CCF2 0%, #8CE0FF 55%, #D4F5FF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .pill {
      background: rgba(255, 255, 255, 0.92);
      border: 3px solid #FFFFFF;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 16px;
      font-weight: 900;
      color: #1E293B;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, background-color 0.2s ease;
    }
    .pill:active {
      transform: scale(0.94);
    }
    .pill.active-quest {
      background: #FEF08A;
      border-color: #FACC15;
    }
    .pill.locked-btn {
      opacity: 0.55;
    }
    #questBanner {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid #FACC15;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 20px;
      font-weight: 900;
      color: #1E293B;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 9;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
    }
    #questBanner.visible {
      display: flex;
    }
    #lockBtn {
      position: relative;
      overflow: hidden;
    }
    #lockProgress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(250, 204, 21, 0.45);
      pointer-events: none;
    }
    #quizModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 25;
      padding: 16px;
    }
    #quizModal.visible {
      display: flex;
    }
    .quiz-card {
      background: #FFFFFF;
      border: 8px solid #3A86FF;
      border-radius: 36px;
      width: min(92vw, 430px);
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .quiz-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #F1F5F9;
      border: none;
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }
    .quiz-prompt {
      font-size: 26px;
      font-weight: 900;
      color: #1E293B;
    }
    .quiz-emoji {
      font-size: 118px;
      line-height: 1.15;
      margin: 4px 0;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.12));
    }
    .quiz-heard {
      min-height: 30px;
      font-size: 18px;
      font-weight: 800;
      color: #475569;
      background: #F8FAFC;
      border-radius: 16px;
      padding: 6px 14px;
      width: 100%;
    }
    .quiz-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }
    .quiz-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.16);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quiz-btn:active {
      transform: scale(0.95);
    }
    .quiz-btn-mic {
      background: #FF4D6D;
    }
    .quiz-btn-mic.listening {
      background: #10B981;
      animation: micPulse 1s infinite;
    }
    .quiz-btn-repeat {
      background: #3A86FF;
    }
    .quiz-btn-next {
      background: #FF9F1C;
    }
    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    #popBadge.bump {
      animation: badgeBump 0.28s ease;
    }
    @keyframes badgeBump {
      0% { transform: scale(1); }
      50% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="hud-top">
    <div class="hud-left">
      <div id="popBadge" class="pill" aria-label="Balloons Popped">
        <span>🎈</span>
        <span id="popCount">0</span>
      </div>
      <button id="langBtn" class="pill lockable" type="button" aria-label="Switch Language">🌐 EN</button>
      <button id="modeBtn" class="pill lockable" type="button">ABC &amp; 123</button>
      <button id="playStyleBtn" class="pill lockable" type="button">🎈 Tap</button>
      <button id="quizOpenBtn" class="pill lockable" type="button">❓ Quiz</button>
      <button id="micEchoBtn" class="pill lockable" type="button">🎤 Repeat Me</button>
      <button id="questBtn" class="pill lockable" type="button">🎯 Find It: OFF</button>
    </div>
    <div class="hud-right">
      <button id="speedBtn" class="pill lockable" type="button" aria-label="Balloon Speed">🐢 Slow</button>
      <button id="soundBtn" class="pill lockable" type="button" aria-label="Toggle Sound">🔊</button>
      <button id="lockBtn" class="pill" type="button" aria-label="Hold 3 seconds to lock or unlock controls">
        <span id="lockProgress"></span>
        <span id="lockLabel">🔓</span>
      </button>
    </div>
  </div>

  <div id="questBanner" role="button" aria-label="Repeat target prompt">
    <span id="questEmoji">🍎</span>
    <span id="questText">Find: Apple</span>
  </div>

  <div id="quizModal" role="dialog" aria-modal="true" aria-label="What is this quiz">
    <div class="quiz-card">
      <button id="quizCloseBtn" class="quiz-close" type="button" aria-label="Close Quiz">✕</button>
      <div id="quizPromptText" class="quiz-prompt">What is this?</div>
      <div id="quizEmojiDisplay" class="quiz-emoji">🍎</div>
      <div id="quizHeardText" class="quiz-heard">🎤 Tap Speak &amp; say its name!</div>
      <div class="quiz-actions">
        <button id="quizMicBtn" class="quiz-btn quiz-btn-mic" type="button">🎤 Speak Answer</button>
        <button id="quizAskAgainBtn" class="quiz-btn quiz-btn-repeat" type="button">🔊 Ask Again</button>
        <button id="quizNextBtn" class="quiz-btn quiz-btn-next" type="button">➡️ Next</button>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const popBadge = document.getElementById('popBadge');
      const popCountEl = document.getElementById('popCount');
      const langBtn = document.getElementById('langBtn');
      const modeBtn = document.getElementById('modeBtn');
      const playStyleBtn = document.getElementById('playStyleBtn');
      const quizOpenBtn = document.getElementById('quizOpenBtn');
      const micEchoBtn = document.getElementById('micEchoBtn');
      const questBtn = document.getElementById('questBtn');
      const speedBtn = document.getElementById('speedBtn');
      const soundBtn = document.getElementById('soundBtn');
      const lockBtn = document.getElementById('lockBtn');
      const lockLabel = document.getElementById('lockLabel');
      const lockProgress = document.getElementById('lockProgress');
      const questBanner = document.getElementById('questBanner');
      const questEmojiEl = document.getElementById('questEmoji');
      const questTextEl = document.getElementById('questText');
      const quizModal = document.getElementById('quizModal');
      const quizCloseBtn = document.getElementById('quizCloseBtn');
      const quizPromptText = document.getElementById('quizPromptText');
      const quizEmojiDisplay = document.getElementById('quizEmojiDisplay');
      const quizHeardText = document.getElementById('quizHeardText');
      const quizMicBtn = document.getElementById('quizMicBtn');
      const quizAskAgainBtn = document.getElementById('quizAskAgainBtn');
      const quizNextBtn = document.getElementById('quizNextBtn');

      // Polyfill roundRect for older mobile WebViews / browsers
      if (ctx && typeof ctx.roundRect !== 'function') {
        ctx.roundRect = function (x, y, w, h, r) {
          const rad = Array.isArray(r) ? r[0] : (r || 0);
          this.moveTo(x + rad, y);
          this.arcTo(x + w, y, x + w, y + h, rad);
          this.arcTo(x + w, y + h, x, y + h, rad);
          this.arcTo(x, y + h, x, y, rad);
          this.arcTo(x, y, x + w, y, rad);
          this.closePath();
          return this;
        };
      }

      let width = window.innerWidth || document.documentElement.clientWidth || 360;
      let height = window.innerHeight || document.documentElement.clientHeight || 640;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resizeCanvas() {
        const nextW = window.innerWidth || document.documentElement.clientWidth || canvas.clientWidth;
        const nextH = window.innerHeight || document.documentElement.clientHeight || canvas.clientHeight;
        if (nextW > 0 && nextH > 0) {
          width = nextW;
          height = nextH;
        }
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      if (typeof ResizeObserver !== 'undefined') {
        try {
          new ResizeObserver(() => resizeCanvas()).observe(document.body);
        } catch (e) {}
      }

      // ------------------------------------------------------------------------
      // 1. WEB AUDIO + MULTILINGUAL SPEECH ENGINE (EN / UR / AR)
      // ------------------------------------------------------------------------
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.isMuted = false;
          this.voicesByLang = { en: null, ur: null, ar: null };
          if ('speechSynthesis' in window) {
            this.loadVoices();
            window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
          }
        }

        loadVoices() {
          if (!('speechSynthesis' in window)) return;
          try {
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return;
            this.voicesByLang.en =
              voices.find((v) => /en/i.test(v.lang) && /female|samantha|victoria|karen|zira|google us english/i.test(v.name)) ||
              voices.find((v) => /^en(-|_)(US|GB|IN|AU)/i.test(v.lang)) ||
              voices.find((v) => /^en/i.test(v.lang)) ||
              voices[0];
            this.voicesByLang.ur =
              voices.find((v) => /^ur(-|_)(PK|IN)/i.test(v.lang)) ||
              voices.find((v) => /^ur/i.test(v.lang)) ||
              voices.find((v) => /urdu/i.test(v.name)) ||
              null;
            this.voicesByLang.ar =
              voices.find((v) => /^ar(-|_)(SA|EG|AE|JO)/i.test(v.lang)) ||
              voices.find((v) => /^ar/i.test(v.lang)) ||
              voices.find((v) => /arabic/i.test(v.name)) ||
              null;
          } catch (e) {}
        }

        unlock() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              try {
                this.ctx = new AudioCtx();
              } catch (e) {}
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          if ('speechSynthesis' in window && window.speechSynthesis.paused) {
            try {
              window.speechSynthesis.resume();
            } catch (e) {}
          }
        }

        speakPhrase(text, interrupt = true, lang = currentLang, fallbackText = null, onEnd = null) {
          if (this.isMuted || !('speechSynthesis' in window) || !text) {
            if (onEnd) setTimeout(onEnd, 200);
            return;
          }
          try {
            if (interrupt) {
              window.speechSynthesis.cancel();
            }
            const nativeVoice = this.voicesByLang[lang];
            const useFallback = (lang === 'ur' || lang === 'ar') && !nativeVoice && fallbackText;
            const utter = new SpeechSynthesisUtterance(useFallback ? fallbackText : text);

            if (useFallback) {
              utter.lang = 'en-US';
              if (this.voicesByLang.en) utter.voice = this.voicesByLang.en;
            } else if (lang === 'ur') {
              utter.lang = nativeVoice ? nativeVoice.lang : 'ur-PK';
              if (nativeVoice) utter.voice = nativeVoice;
            } else if (lang === 'ar') {
              utter.lang = nativeVoice ? nativeVoice.lang : 'ar-SA';
              if (nativeVoice) utter.voice = nativeVoice;
            } else {
              utter.lang = 'en-US';
              if (nativeVoice) utter.voice = nativeVoice;
            }

            utter.rate = 0.9;
            utter.pitch = 1.15;
            utter.volume = 1.0;
            if (onEnd) {
              let doneCalled = false;
              const finish = () => {
                if (doneCalled) return;
                doneCalled = true;
                onEnd();
              };
              utter.onend = finish;
              utter.onerror = finish;
              // Safety fallback timer in case Android WebView does not fire onend
              setTimeout(finish, Math.max(1400, text.length * 95));
            }
            window.speechSynthesis.speak(utter);
          } catch (e) {
            if (onEnd) setTimeout(onEnd, 200);
          }
        }

        speakBalloon(balloon) {
          if (!balloon) return;
          const lang = balloon.lang || currentLang;

          if (balloon.kind === 'MATH' && balloon.mathObj) {
            const sp = balloon.mathObj.speech[lang] || balloon.mathObj.speech.en;
            const fb = balloon.mathObj.fallback ? balloon.mathObj.fallback[lang] : null;
            this.speakPhrase(sp, true, lang, fb);
            return;
          }

          if (balloon.kind === 'COLOR' && balloon.colorObj) {
            const cName = lang === 'ur' ? balloon.colorObj.ur : lang === 'ar' ? balloon.colorObj.ar : balloon.colorObj.name;
            const phrase =
              lang === 'ur' ? `${cName} غبارہ!` :
              lang === 'ar' ? `بالون ${cName}!` :
              `${cName} balloon!`;
            const fb =
              lang === 'ur' ? `${balloon.colorObj.urEn} balloon!` :
              lang === 'ar' ? `Baloon ${balloon.colorObj.arEn}!` :
              null;
            this.speakPhrase(phrase, true, lang, fb);
            return;
          }

          if (balloon.kind === 'SHAPE' && balloon.shapeObj) {
            const sName = lang === 'ur' ? balloon.shapeObj.ur : lang === 'ar' ? balloon.shapeObj.ar : balloon.shapeObj.name;
            const fb =
              lang === 'ur' ? balloon.shapeObj.urEn :
              lang === 'ar' ? balloon.shapeObj.arEn :
              null;
            this.speakPhrase(`${sName}!`, true, lang, fb);
            return;
          }

          const item = balloon.item;
          if (!item) return;

          if (lang === 'ur') {
            const phrase = balloon.letterName
              ? `${balloon.letterName} سے ${item.word}!`
              : `${item.word}!`;
            const fb = balloon.letterEn
              ? `${balloon.letterEn} say ${item.en || item.word}!`
              : `${item.en || item.word}!`;
            this.speakPhrase(phrase, true, 'ur', fb);
          } else if (lang === 'ar') {
            const phrase = balloon.letterName
              ? `${balloon.letterName}... ${item.word}!`
              : `${item.word}!`;
            const fb = balloon.letterEn
              ? `${balloon.letterEn}... ${item.en || item.word}!`
              : `${item.en || item.word}!`;
            this.speakPhrase(phrase, true, 'ar', fb);
          } else {
            const isLetter = /^[A-Z]$/.test(balloon.char);
            const phrase = isLetter
              ? `${balloon.char.toLowerCase()}... for ${item.word}!`
              : `${item.word}!`;
            this.speakPhrase(phrase, true, 'en');
          }
        }

        speakTalkBack(stage, lang = currentLang) {
          const lines = {
            en: [
              { text: 'Heehee! That tickles!', fb: null },
              { text: 'Leave me! I will burst if touched hard!', fb: null },
              { text: 'Whoa, careful! I am getting super big!', fb: null }
            ],
            ur: [
              { text: 'ہی ہی! مجھے گدگدی ہو رہی ہے!', fb: 'Heehee! Mujhe gudgudi ho rahi hai!' },
              { text: 'مجھے چھوڑ دو! زور سے چھونے پر میں پھٹ جاؤں گا!', fb: 'Mujhe chhor do! Zor se chhoonay par main phat jaoon ga!' },
              { text: 'ارے سنبھل کر! میں بہت بڑا ہو رہا ہوں!', fb: 'Aray sambhal kar! Main bohot bara ho raha hoon!' }
            ],
            ar: [
              { text: 'هاهاها! هذا يدغدغني!', fb: 'Hahaha! Haatha yudaghdighuni!' },
              { text: 'اتركني! سوف أنفجر إذا لمستني بقوة!', fb: 'Utrukni! Sawfa anfajir itha lamastani biquwwa!' },
              { text: 'انتبه! أنا أكبر كثيرا!', fb: 'Intabih! Ana akbar katheeran!' }
            ]
          };
          const pool = lines[lang] || lines.en;
          const chosen = pool[stage % pool.length];
          this.speakPhrase(chosen.text, true, lang, chosen.fb);
          this.playTickleBoing(stage);
        }

        playTickleBoing(stage = 0) {
          if (this.isMuted) return;
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const baseFreq = 280 + stage * 95;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.12);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.95, now + 0.24);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.26);
          } catch (e) {}
        }

        playShootSound() {
          if (this.isMuted) return;
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.14);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
          } catch (e) {}
        }

        playMilestone() {
          if (this.isMuted) return;
          this.unlock();
          const cheer =
            currentLang === 'ur' ? 'شاباش! بہت اچھے!' :
            currentLang === 'ar' ? 'أحسنت! رائع جدا!' :
            'Yay! Great job!';
          const cheerFb =
            currentLang === 'ur' ? 'Shabaash! Bohot achay!' :
            currentLang === 'ar' ? 'Ahsanta! Raai jiddan!' :
            null;
          this.speakPhrase(cheer, true, currentLang, cheerFb);
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
            notes.forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.09);
              gain.gain.setValueAtTime(0.22, now + idx * 0.09);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + idx * 0.09);
              osc.stop(now + idx * 0.09 + 0.36);
            });
          } catch (e) {}
        }

        playPop(isRainbow = false, balloon = null) {
          if (this.isMuted) return;
          this.unlock();
          if (balloon !== null) {
            this.speakBalloon(balloon);
          }
          if (!this.ctx) return;

          try {
            const now = this.ctx.currentTime;
            // Cheerful pop bubble tone
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(isRainbow ? 520 : 380, now);
            osc.frequency.exponentialRampToValueAtTime(isRainbow ? 1150 : 880, now + 0.11);

            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);

            // Sparkle chime for rainbow balloons
            if (isRainbow) {
              [659.25, 783.99, 1046.5].forEach((freq, idx) => {
                const chime = this.ctx.createOscillator();
                const cGain = this.ctx.createGain();
                chime.type = 'triangle';
                chime.frequency.setValueAtTime(freq, now + idx * 0.06);
                cGain.gain.setValueAtTime(0.18, now + idx * 0.06);
                cGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
                chime.connect(cGain);
                cGain.connect(this.ctx.destination);
                chime.start(now + idx * 0.06);
                chime.stop(now + idx * 0.06 + 0.26);
              });
            }
          } catch (e) {}
        }
      }

      const audio = new SoundEngine();

      // ------------------------------------------------------------------------
      // 1B. SPEECH RECOGNITION ENGINE (LISTENS TO CHILD'S VOICE & REPEATS BACK)
      // ------------------------------------------------------------------------
      const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
      let activeRecognition = null;
      let isListeningForEcho = false;

      function stopActiveRecognition() {
        if (activeRecognition) {
          try {
            activeRecognition.abort();
          } catch (e) {}
          activeRecognition = null;
        }
        quizMicBtn.classList.remove('listening');
        micEchoBtn.classList.remove('active-quest');
        isListeningForEcho = false;
      }

      function startVoiceListener({ onResultText, onStatusText, onDone }) {
        audio.unlock();
        stopActiveRecognition();
        if (!SpeechRecognitionAPI) {
          if (onStatusText) {
            onStatusText(
              currentLang === 'ur' ? 'مائیک دستیاب نہیں — نیچے جواب دیکھیں!' :
              currentLang === 'ar' ? 'الميكروفون غير مدعوم هنا' :
              'Mic not supported in this browser'
            );
          }
          if (onDone) onDone(false);
          return;
        }

        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          const rec = new SpeechRecognitionAPI();
          activeRecognition = rec;
          rec.lang = currentLang === 'ur' ? 'ur-PK' : currentLang === 'ar' ? 'ar-SA' : 'en-US';
          rec.interimResults = true;
          rec.maxAlternatives = 3;
          rec.continuous = false;

          let finalTranscript = '';

          rec.onstart = () => {
            if (onStatusText) {
              onStatusText(
                currentLang === 'ur' ? '🎙️ بولیں، میں سن رہا ہوں...' :
                currentLang === 'ar' ? '🎙️ تكلم الآن، أنا أسمعك...' :
                '🎙️ Listening... Speak loudly!'
              );
            }
          };

          rec.onresult = (event) => {
            let interim = '';
            const alternatives = [];
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const res = event.results[i];
              for (let j = 0; j < res.length; j++) {
                alternatives.push(res[j].transcript.trim());
              }
              if (res.isFinal) {
                finalTranscript += res[0].transcript;
              } else {
                interim += res[0].transcript;
              }
            }
            const display = (finalTranscript || interim).trim();
            if (display && onStatusText) {
              onStatusText(`🗣️ "${display}"`);
            }
            if (finalTranscript.trim() && onResultText) {
              onResultText(finalTranscript.trim(), alternatives);
            }
          };

          rec.onerror = (err) => {
            if (err && err.error === 'aborted') return;
            if (onStatusText) {
              const reason = err && (err.error === 'not-allowed' || err.error === 'service-not-allowed')
                ? (currentLang === 'ur' ? 'مائیک کی اجازت بند ہے — تصویر پر ٹیپ کر کے جواب سنیں!' :
                   currentLang === 'ar' ? 'إذن الميكروفون مغلق — اضغط على الصورة للإجابة!' :
                   'Mic blocked in preview — tap the big picture to hear & answer!')
                : (currentLang === 'ur' ? 'آواز صاف نہیں آئی، دوبارہ بٹن دبائیں!' :
                   currentLang === 'ar' ? 'لم أسمع جيداً، اضغط للتحدث مرة أخرى!' :
                   'Didn’t catch that — tap Speak or tap the picture!');
              onStatusText(reason);
            }
            if (onDone) onDone(false);
          };

          rec.onend = () => {
            if (activeRecognition === rec) {
              activeRecognition = null;
            }
            quizMicBtn.classList.remove('listening');
            micEchoBtn.classList.remove('active-quest');
            isListeningForEcho = false;
            if (onDone) onDone(Boolean(finalTranscript.trim()));
          };

          rec.start();
        } catch (e) {
          if (onDone) onDone(false);
        }
      }

            kind: 'COLOR',
            char: currentLang === 'en' ? colorLabel.toUpperCase() : colorLabel,
            colorObj: palette,
            item: {
              word: currentLang === 'ur' ? `${colorLabel} غبارہ` : currentLang === 'ar' ? `بالون ${colorLabel}` : `${colorLabel} Balloon`,
              emoji: '🎈'
            }
          };
        }
        if (learningMode === 'SHAPES') {
          const shapeObj = SHAPES_LIST[Math.floor(Math.random() * SHAPES_LIST.length)];
          const shapeLabel = getLocalizedField(shapeObj);
          return {
            lang: currentLang,
            kind: 'SHAPE',
            char: currentLang === 'en' ? shapeLabel.toUpperCase() : shapeLabel,
            shapeObj,
            item: { word: shapeLabel, emoji: shapeObj.emoji }
          };
        }
        if (learningMode === 'MATH') {
          const mathObj = VISUAL_MATH_LIST[Math.floor(Math.random() * VISUAL_MATH_LIST.length)];
          const visualGroup = `${mathObj.emoji.repeat(mathObj.a)} + ${mathObj.emoji.repeat(mathObj.b)}`;
          return {
            lang: currentLang,
            kind: 'MATH',
            char: mathObj.ansText[currentLang],
            mathObj,
            item: {
              word: mathObj.word[currentLang],
              emoji: visualGroup
            }
          };
        }
        const char = getNextCharacter();
        const { item, letterName, letterEn } = getObjectForCharacter(char, currentLang);
        return {
          lang: currentLang,
          kind: 'CHAR',
          char,
          letterName,
          letterEn,
          item
        };
      }

      function spawnBalloon(forceY = null) {
        const baseRadius = Math.max(54, Math.min(width, height) * 0.098);
        const radius = baseRadius * (0.95 + Math.random() * 0.16);
        const isRainbow = learningMode !== 'COLORS' && Math.random() < 0.14;
        const palette = BALLOON_PALETTES[Math.floor(Math.random() * BALLOON_PALETTES.length)];
        const content = createBalloonContent(palette);

        const margin = radius + 24;
        const x = margin + Math.random() * Math.max(40, width - margin * 2);
        const y = forceY !== null ? forceY : height + radius * 1.4;
        const speedY = height / (7.0 + Math.random() * 2.5);

        balloons.push({
          x,
          baseX: x,
          y,
          radius,
          speedY,
          swayAmp: 16 + Math.random() * 22,
          swayFreq: 1.1 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
          palette,
          isRainbow,
          hueShift: Math.random() * 360,
          rubCount: 0,
          wobbleTime: 0,
          inflateScale: 1,
          ...content
        });
      }

      function pickNewQuest(speakNow = true) {
        if (!questMode) {
          currentQuest = null;
          questBanner.classList.remove('visible');
          return;
        }
        if (balloons.length === 0) {
          spawnBalloon(height * 0.65);
        }
        const target = balloons[Math.floor(Math.random() * balloons.length)];
        if (target.kind === 'COLOR') {
          const cName = getLocalizedField(target.colorObj);
          currentQuest = {
            key: target.colorObj.name,
            label: currentLang === 'ur' ? `ڈھونڈیں: ${cName}` : currentLang === 'ar' ? `ابحث عن: ${cName}` : `Find: ${cName}`,
            emoji: '🎨',
            prompt:
              currentLang === 'ur' ? `${cName} غبارہ پھوڑیں!` :
              currentLang === 'ar' ? `فرقع البالون ${cName}!` :
              `Can you pop the ${cName} balloon?`,
            fallback:
              currentLang === 'ur' ? `${target.colorObj.urEn} balloon phorain!` :
              currentLang === 'ar' ? `Farqi al baloon ${target.colorObj.arEn}!` :
              null
          };
        } else if (target.kind === 'SHAPE') {
          const sName = getLocalizedField(target.shapeObj);
          currentQuest = {
            key: target.shapeObj.id,
            label: currentLang === 'ur' ? `ڈھونڈیں: ${sName}` : currentLang === 'ar' ? `ابحث عن: ${sName}` : `Find: ${sName}`,
            emoji: target.shapeObj.emoji,
            prompt:
              currentLang === 'ur' ? `${sName} والا غبارہ پھوڑیں!` :
              currentLang === 'ar' ? `فرقع شكل ${sName}!` :
              `Can you pop the ${sName}?`,
            fallback:
              currentLang === 'ur' ? `${target.shapeObj.urEn} waala balloon phorain!` :
              currentLang === 'ar' ? `Farqi shakl ${target.shapeObj.arEn}!` :
              null
          };
        } else if (target.kind === 'MATH') {
          const m = target.mathObj;
          const shortEq = currentLang === 'ur' ? `${m.a} + ${m.b} = ؟` : currentLang === 'ar' ? `${m.a} + ${m.b} = ؟` : `${m.a} + ${m.b} = ?`;
          currentQuest = {
            key: m.id,
            label: currentLang === 'ur' ? `حل کریں: ${shortEq}` : currentLang === 'ar' ? `احسب: ${shortEq}` : `Solve: ${shortEq}`,
            emoji: '➕',
            prompt:
              currentLang === 'ur' ? `${m.a} جمع ${m.b} کتنا ہوتا ہے؟` :
              currentLang === 'ar' ? `كم يساوي ${m.a} زائد ${m.b}؟` :
              `What is ${m.a} plus ${m.b}?`,
            fallback:
              currentLang === 'ur' ? `${m.a} jama ${m.b} kitna hota hai?` :
              currentLang === 'ar' ? `Kam yusaawi ${m.a} zaaid ${m.b}?` :
              null
          };
        } else {
          currentQuest = {
            key: target.char,
            label:
              currentLang === 'ur' ? `ڈھونڈیں: ${target.char} (${target.item.word})` :
              currentLang === 'ar' ? `ابحث عن: ${target.char} (${target.item.word})` :
              `Find: ${target.char} (${target.item.word})`,
            emoji: target.item.emoji,
            prompt:
              currentLang === 'ur' ? `${target.letterName ? target.letterName + ' سے ' : ''}${target.item.word} پھوڑیں!` :
              currentLang === 'ar' ? `أين ${target.item.word}؟` :
              `Can you pop ${target.char.toLowerCase()} for ${target.item.word}?`,
            fallback:
              currentLang === 'ur' ? `${target.letterEn ? target.letterEn + ' say ' : ''}${target.item.en || target.item.word} phorain!` :
              currentLang === 'ar' ? `Ayna ${target.item.en || target.item.word}?` :
              null
          };
        }
        questEmojiEl.textContent = currentQuest.emoji;
        questTextEl.textContent = currentQuest.label;
        questBanner.classList.add('visible');
        if (speakNow) {
          audio.speakPhrase(currentQuest.prompt, true, currentLang, currentQuest.fallback);
        }
      }

      function matchesQuest(balloon) {
        if (!questMode || !currentQuest) return false;
        if (balloon.kind === 'COLOR') return balloon.colorObj.name === currentQuest.key;
        if (balloon.kind === 'SHAPE') return balloon.shapeObj.id === currentQuest.key;
        if (balloon.kind === 'MATH') return balloon.mathObj.id === currentQuest.key;
        return balloon.char === currentQuest.key;
      }

      // ------------------------------------------------------------------------
      // 4. DRAWING HELPERS (CLOUDS, BALLOONS, SHAPES, MATH & CHARACTERS)
      // ------------------------------------------------------------------------
      function drawCloud(c) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.arc(28, -8, 38, 0, Math.PI * 2);
        ctx.arc(62, 0, 30, 0, Math.PI * 2);
        ctx.arc(30, 12, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBalloonMath(mathObj, r, lang = currentLang) {
        ctx.save();
        // Top row: visual countable objects (e.g. 🍎🍎 + 🍎)
        const groupText = `${mathObj.emoji.repeat(mathObj.a)} + ${mathObj.emoji.repeat(mathObj.b)}`;
        const emojiSize = Math.max(15, Math.round(r * 0.28));
        ctx.font = `900 ${emojiSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(groupText, 0, -r * 0.28, r * 1.72);

        // Bottom pill: clear equation (e.g. 2 + 1 = 3)
        const eqText = mathObj.expr[lang] || mathObj.expr.en;
        const eqSize = Math.max(17, Math.round(r * 0.34));
        ctx.font = `900 ${eqSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.lineJoin = 'round';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.78)';
        ctx.strokeText(eqText, 0, r * 0.34, r * 1.7);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(eqText, 0, r * 0.34, r * 1.7);
        ctx.restore();
      }

      function drawBalloon(b, time) {
        const wobble = b.wobbleTime > 0 ? Math.sin(b.wobbleTime * 38) * 0.14 * b.wobbleTime : 0;
        const scale = b.inflateScale || 1;
        const rx = b.radius * scale;
        const ry = b.radius * 1.16 * scale;

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(wobble);

        // 1. Wavy Balloon String
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, ry + 6);
        const wave = Math.sin(time * 3 + b.phase) * 10;
        ctx.quadraticCurveTo(wave, ry + 34, -wave * 0.6, ry + 64);
        ctx.stroke();

        // 2. Balloon Knot
        ctx.fillStyle = b.isRainbow ? '#FF477E' : b.palette.dark;
        ctx.beginPath();
        ctx.moveTo(-7, ry + 8);
        ctx.lineTo(7, ry + 8);
        ctx.lineTo(0, ry - 1);
        ctx.closePath();
        ctx.fill();

        // 3. Balloon Body Gradient
        const grad = ctx.createRadialGradient(-rx * 0.3, -ry * 0.3, rx * 0.12, 0, 0, ry * 1.1);
        if (b.isRainbow) {
          const h = (b.hueShift + time * 90) % 360;
          grad.addColorStop(0, '#FFFFFF');
          grad.addColorStop(0.25, `hsl(${h}, 95%, 65%)`);
          grad.addColorStop(0.65, `hsl(${(h + 110) % 360}, 90%, 55%)`);
          grad.addColorStop(1, `hsl(${(h + 220) % 360}, 85%, 45%)`);
        } else {
          grad.addColorStop(0, b.palette.light);
          grad.addColorStop(0.55, b.palette.main);
          grad.addColorStop(1, b.palette.dark);
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        // 4. Glossy White Highlight Shine
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.ellipse(-rx * 0.36, -ry * 0.34, rx * 0.14, ry * 0.24, -0.45, 0, Math.PI * 2);
        ctx.fill();

        // 5. Quest Target Halo if Find-It Mode matches this balloon
        if (matchesQuest(b)) {
          const pulse = 1 + Math.sin(time * 7) * 0.06;
          ctx.save();
          ctx.strokeStyle = '#FEF08A';
          ctx.lineWidth = 6;
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.ellipse(0, 0, rx * 1.12 * pulse, ry * 1.12 * pulse, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 6. Content Inside Balloon (Letter/Digit, Color Label, Geometric Shape, or Visual Math)
        if (b.kind === 'SHAPE') {
          drawBalloonShape(b.shapeObj, rx, b.lang);
        } else if (b.kind === 'COLOR') {
          drawColorLabel(b.char, rx);
        } else if (b.kind === 'MATH') {
          drawBalloonMath(b.mathObj, rx, b.lang);
        } else {
          drawBalloonCharacter(b.char, b.item, rx);
        }

        // 7. Cute expressive eyes & rosy cheeks in Tickle & Talk mode
        if (playStyle === 'TICKLE') {
          drawBalloonFace(rx, ry, b.rubCount, b.wobbleTime > 0);
        }

        ctx.restore();
      }

      function drawBalloonFace(rx, ry, rubCount, isTickled) {
        ctx.save();
        const eyeY = -ry * 0.62;
        const eyeOffsetX = rx * 0.26;
        ctx.strokeStyle = '#1E293B';
        ctx.fillStyle = '#1E293B';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';

        if (isTickled || rubCount > 0) {
          // Happy squinty giggling eyes (^ ^)
          [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
            ctx.beginPath();
            ctx.arc(ex, eyeY + 3, rx * 0.1, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          });
        } else {
          [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
            ctx.beginPath();
            ctx.arc(ex, eyeY, rx * 0.065, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        // Rosy blushing cheeks
        ctx.fillStyle = 'rgba(255, 105, 135, 0.55)';
        ctx.beginPath();
        ctx.ellipse(-eyeOffsetX * 1.35, eyeY + rx * 0.11, rx * 0.11, rx * 0.065, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeOffsetX * 1.35, eyeY + rx * 0.11, rx * 0.11, rx * 0.065, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute smile / surprised "O" mouth when close to bursting
        ctx.beginPath();
        if (rubCount >= 2) {
          ctx.arc(0, eyeY + rx * 0.16, rx * 0.09, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.arc(0, eyeY + rx * 0.1, rx * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawLauncher() {
        const lx = width * 0.5;
        const ly = height - 26;
        ctx.save();
        ctx.translate(lx, ly);

        // Aim guide dotted line
        ctx.save();
        ctx.rotate(launcherAngle + Math.PI / 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 10]);
        ctx.beginPath();
        ctx.moveTo(0, -48);
        ctx.lineTo(0, -Math.min(height * 0.55, 340));
        ctx.stroke();

        // Colorful star cannon barrel
        const barrelGrad = ctx.createLinearGradient(-18, -56, 18, 0);
        barrelGrad.addColorStop(0, '#FACC15');
        barrelGrad.addColorStop(0.5, '#FF9F1C');
        barrelGrad.addColorStop(1, '#FF4D6D');
        ctx.fillStyle = barrelGrad;
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(-18, -58, 36, 54, 14);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Cannon base dome
        ctx.fillStyle = '#3A86FF';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 10, 38, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.font = '24px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', 0, -6);
        ctx.restore();
      }

      function drawSpeechBubbles(dt) {
        for (let i = speechBubbles.length - 1; i >= 0; i--) {
          const sb = speechBubbles[i];
          sb.age += dt;
          if (sb.age >= sb.duration) {
            speechBubbles.splice(i, 1);
            continue;
          }
          if (sb.balloon) {
            sb.x = sb.balloon.x;
            sb.y = sb.balloon.y - sb.balloon.radius * (sb.balloon.inflateScale || 1) * 1.45;
          }
          const alpha = sb.age > sb.duration - 0.35 ? Math.max(0, (sb.duration - sb.age) / 0.35) : 1;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '900 18px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          const textW = Math.min(width * 0.78, Math.max(150, ctx.measureText(sb.text).width + 30));
          const boxH = 44;
          const bx = Math.max(12, Math.min(width - textW - 12, sb.x - textW / 2));
          const by = Math.max(76, sb.y - boxH / 2);

          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#FF4D6D';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.roundRect(bx, by, textW, boxH, 20);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#1E293B';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(sb.text, bx + textW / 2, by + boxH / 2 + 1, textW - 20);
          ctx.restore();
        }
      }

      function drawColorLabel(colorName, r) {
        ctx.save();
        const fontSize = Math.max(18, Math.round(r * 0.36));
        ctx.font = `900 ${fontSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.strokeText(colorName, 0, 0);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(colorName, 0, 0);
        ctx.restore();
      }

      function drawBalloonShape(shapeObj, r, lang = currentLang) {
        ctx.save();
        const s = r * 0.46;
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';

        ctx.beginPath();
        if (shapeObj.id === 'CIRCLE') {
          ctx.arc(0, -r * 0.14, s, 0, Math.PI * 2);
        } else if (shapeObj.id === 'SQUARE') {
          ctx.roundRect(-s * 0.88, -r * 0.14 - s * 0.88, s * 1.76, s * 1.76, 10);
        } else if (shapeObj.id === 'TRIANGLE') {
          ctx.moveTo(0, -r * 0.14 - s);
          ctx.lineTo(s * 0.96, -r * 0.14 + s * 0.82);
          ctx.lineTo(-s * 0.96, -r * 0.14 + s * 0.82);
          ctx.closePath();
        } else if (shapeObj.id === 'STAR') {
          for (let i = 0; i < 10; i++) {
            const rad = i % 2 === 0 ? s * 1.05 : s * 0.46;
            const ang = (Math.PI * i) / 5 - Math.PI / 2;
            const px = Math.cos(ang) * rad;
            const py = -r * 0.14 + Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (shapeObj.id === 'HEART') {
          const topY = -r * 0.14 - s * 0.35;
          ctx.moveTo(0, topY + s * 1.25);
          ctx.bezierCurveTo(-s * 1.3, topY + s * 0.4, -s * 0.7, topY - s * 0.65, 0, topY - s * 0.1);
          ctx.bezierCurveTo(s * 0.7, topY - s * 0.65, s * 1.3, topY + s * 0.4, 0, topY + s * 1.25);
          ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();

        const shapeTitle = lang === 'ur' ? shapeObj.ur : lang === 'ar' ? shapeObj.ar : shapeObj.name.toUpperCase();
        const labelSize = Math.max(13, Math.round(r * 0.25));
        ctx.font = `900 ${labelSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeText(shapeTitle, 0, r * 0.54);
        ctx.fillText(shapeTitle, 0, r * 0.54);
        ctx.restore();
      }

      function drawBalloonCharacter(char, item, r) {
        ctx.save();
        const fontSize = Math.round(r * 0.86);
        ctx.font = `900 ${fontSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(5, Math.round(r * 0.14));
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.strokeText(char, 0, -r * 0.26);

        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(char, 0, -r * 0.26);

        if (item && item.emoji) {
          const badgeR = r * 0.34;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.beginPath();
          ctx.arc(0, r * 0.44, badgeR, 0, Math.PI * 2);
          ctx.fill();

          const emojiSize = Math.round(r * 0.46);
          ctx.font = `${emojiSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
          ctx.fillText(item.emoji, 0, r * 0.47);
        }
        ctx.restore();
      }

      // ------------------------------------------------------------------------
      // 5. CELEBRATION POP EFFECTS, MILESTONES & FLASHCARD CALLOUTS
      // ------------------------------------------------------------------------
      function spawnFireworksBurst(cx, cy, count = 42) {
        const colors = ['#FF4D6D', '#FFD166', '#06D6A0', '#3A86FF', '#9B5DE5', '#F15BB5', '#FFFFFF'];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
          const speed = 160 + Math.random() * 320;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 80,
            size: 7 + Math.random() * 8,
            color: colors[i % colors.length],
            age: 0,
            duration: 0.75 + Math.random() * 0.4
          });
        }
      }

      function triggerBalloonPop(balloon) {
        const isQuestHit = matchesQuest(balloon);
        poppedTotal += 1;
        popCountEl.textContent = poppedTotal;
        popBadge.classList.remove('bump');
        void popBadge.offsetWidth;
        popBadge.classList.add('bump');

        const isMilestone = poppedTotal % 10 === 0;
        audio.playPop(balloon.isRainbow || isQuestHit, balloon);

        if (isMilestone) {
          spawnFireworksBurst(width * 0.28, height * 0.35, 36);
          spawnFireworksBurst(width * 0.72, height * 0.35, 36);
          setTimeout(() => audio.playMilestone(), 850);
        }

        if (isQuestHit) {
          spawnFireworksBurst(balloon.x, balloon.y, 38);
          setTimeout(() => pickNewQuest(true), 1100);
        }

        popCallouts.push({
          char: balloon.kind === 'CHAR' ? balloon.char : (isQuestHit ? '⭐' : ''),
          item: balloon.item,
          x: width * 0.5,
          y: height * 0.52,
          color: balloon.isRainbow ? '#FF477E' : balloon.palette.main,
          age: 0,
          duration: 1.85
        });

        popRings.push({
          x: balloon.x,
          y: balloon.y,
          r: balloon.radius * 0.4,
          maxR: balloon.radius * 1.9,
          color: balloon.isRainbow ? '#FF477E' : balloon.palette.main,
          age: 0,
          duration: 0.38
        });

        const burstColors = [balloon.palette.main, balloon.palette.light, '#FFD166', '#FFFFFF', '#06D6A0'];
        const count = balloon.isRainbow ? 28 : 18;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          const speed = 130 + Math.random() * 240;
          particles.push({
            x: balloon.x,
            y: balloon.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 60,
            size: 6 + Math.random() * 7,
            color: burstColors[i % burstColors.length],
            age: 0,
            duration: 0.55 + Math.random() * 0.3
          });
        }
      }

      // ------------------------------------------------------------------------
      // 6. MULTI-TOUCH & POINTER INPUT + PARENT CONTROLS
      // ------------------------------------------------------------------------
      function findBalloonAt(clientX, clientY) {
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          const scale = b.inflateScale || 1;
          const dx = (clientX - b.x) / (b.radius * 1.2 * scale);
          const dy = (clientY - b.y) / (b.radius * 1.34 * scale);
          if (dx * dx + dy * dy <= 1) {
            return { balloon: b, index: i };
          }
        }
        return null;
      }

      function getTalkBackBubbleText(stage) {
        const lines = {
          en: ['Heehee! That tickles! 😆', 'Leave me! I will burst! 🙈', 'Careful! Too big!! 🎈'],
          ur: ['ہی ہی! گدگدی ہو رہی ہے! 😆', 'چھوڑ دو! میں پھٹ جاؤں گا! 🙈', 'سنبھل کر! بہت بڑا ہو گیا! 🎈'],
          ar: ['هاهاها! هذا يدغدغني! 😆', 'اتركني! سوف أنفجر! 🙈', 'انتبه! أنا أكبر كثيرا! 🎈']
        };
        const list = lines[currentLang] || lines.en;
        return list[stage % list.length];
      }

      function tickleBalloon(balloon, index) {
        if (balloon.rubCount >= 3) {
          balloons.splice(index, 1);
          triggerBalloonPop(balloon);
          return;
        }
        const stage = balloon.rubCount;
        balloon.rubCount += 1;
        balloon.wobbleTime = 1.0;
        balloon.inflateScale = 1 + balloon.rubCount * 0.13;
        audio.speakTalkBack(stage, currentLang);

        speechBubbles = speechBubbles.filter((sb) => sb.balloon !== balloon);
        speechBubbles.push({
          balloon,
          x: balloon.x,
          y: balloon.y - balloon.radius * 1.4,
          text: getTalkBackBubbleText(stage),
          age: 0,
          duration: 1.7
        });
      }

      function fireShooterAt(targetX, targetY) {
        const lx = width * 0.5;
        const ly = height - 26;
        const rawAngle = Math.atan2(targetY - ly, targetX - lx);
        // Clamp aim angle upwards so toddlers always shoot into the sky
        launcherAngle = Math.max(-Math.PI + 0.22, Math.min(-0.22, rawAngle));
        const speed = Math.max(760, height * 1.25);
        projectiles.push({
          x: lx + Math.cos(launcherAngle) * 44,
          y: ly + Math.sin(launcherAngle) * 44,
          vx: Math.cos(launcherAngle) * speed,
          vy: Math.sin(launcherAngle) * speed,
          radius: 16,
          spin: 0
        });
        audio.playShootSound();
      }

      function handlePopAt(clientX, clientY) {
        audio.unlock();
        if (playStyle === 'SHOOT') {
          fireShooterAt(clientX, clientY);
          return;
        }
        const hit = findBalloonAt(clientX, clientY);
        if (!hit) return;

        if (playStyle === 'TICKLE') {
          activeRubBalloon = hit.balloon;
          rubDistanceAccum = 0;
          lastPointerX = clientX;
          lastPointerY = clientY;
          pointerDownTime = performance.now();
          tickleBalloon(hit.balloon, hit.index);
          return;
        }

        balloons.splice(hit.index, 1);
        triggerBalloonPop(hit.balloon);
      }

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isPointerDown = true;
        handlePopAt(e.clientX, e.clientY);
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        if (playStyle === 'SHOOT') {
          const lx = width * 0.5;
          const ly = height - 26;
          const rawAngle = Math.atan2(e.clientY - ly, e.clientX - lx);
          launcherAngle = Math.max(-Math.PI + 0.22, Math.min(-0.22, rawAngle));
          return;
        }
        if (playStyle === 'TICKLE') {
          const hit = findBalloonAt(e.clientX, e.clientY);
          if (hit) {
            const dist = Math.hypot(e.clientX - lastPointerX, e.clientY - lastPointerY);
            rubDistanceAccum += dist;
            hit.balloon.wobbleTime = Math.max(hit.balloon.wobbleTime, 0.55);
            if (rubDistanceAccum >= 52) {
              rubDistanceAccum = 0;
              tickleBalloon(hit.balloon, hit.index);
            }
          }
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
        }
      }, { passive: false });

      function endPointerInteraction() {
        if (isPointerDown && playStyle === 'TICKLE' && activeRubBalloon) {
          const holdMs = performance.now() - pointerDownTime;
          // Pressing/holding firmly (>420ms) pops the balloon right away!
          if (holdMs > 420) {
            const idx = balloons.indexOf(activeRubBalloon);
            if (idx !== -1) {
              balloons.splice(idx, 1);
              triggerBalloonPop(activeRubBalloon);
            }
          }
        }
        isPointerDown = false;
        activeRubBalloon = null;
        rubDistanceAccum = 0;
      }

      let currentQuizItem = null;

      function getAllQuizItemsForLang(lang) {
        const pool = [];
        if (lang === 'ur') {
          Object.values(URDU_LETTERS).forEach((entry) => {
            entry.items.forEach((it) => {
              pool.push({
                word: it.word,
                altWords: [it.word, it.en || ''],
                emoji: it.emoji,
                question: 'یہ کیا ہے؟',
                questionFb: 'Yeh kya hai?',
                yesSpeech: `جی ہاں! یہ ${it.word} ہے! شاباش!`,
                yesFb: `Jee haan! Yeh ${it.en || it.word} hai! Shabaash!`,
                trySpeech: `دوبارہ کوشش کریں! یہ کیا ہے؟`,
                tryFb: 'Dobaara koshish karain! Yeh kya hai?',
                revealSpeech: `یہ ${it.word} ہے! بولو ${it.word}!`,
                revealFb: `Yeh ${it.en || it.word} hai!`
              });
            });
          });
        } else if (lang === 'ar') {
          Object.values(ARABIC_LETTERS).forEach((entry) => {
            entry.items.forEach((it) => {
              pool.push({
                word: it.word,
                altWords: [it.word, it.en || ''],
                emoji: it.emoji,
                question: 'ما هذا؟',
                questionFb: 'Maa haatha?',
                yesSpeech: `نعم! هذا ${it.word}! أحسنت!`,
                yesFb: `Naam! Haatha ${it.en || it.word}! Ahsanta!`,
                trySpeech: `حاول مرة أخرى! ما هذا؟`,
                tryFb: 'Haawil marra ukhra! Maa haatha?',
                revealSpeech: `هذا ${it.word}! قل ${it.word}!`,
                revealFb: `Haatha ${it.en || it.word}!`
              });
            });
          });
        } else {
          Object.values(LETTER_OBJECTS).forEach((list) => {
            list.forEach((it) => {
              const article = /^[aeiou]/i.test(it.word) ? 'an' : 'a';
              pool.push({
                word: it.word,
                altWords: [it.word],
                emoji: it.emoji,
                question: 'What is this?',
                questionFb: null,
                yesSpeech: `Yes! It's ${article} ${it.word}!`,
                yesFb: null,
                trySpeech: `Almost! Look closely, what is this?`,
                tryFb: null,
                revealSpeech: `It's ${article} ${it.word}! Say ${it.word}!`,
                revealFb: null
              });
            });
          });
        }
        return pool;
      }

      function normalizeSpoken(str) {
        return (str || '')
          .toLowerCase()
          .replace(/[.,!?؟،'"\-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function doesSpokenMatchQuiz(spokenList, quizItem) {
        const targets = quizItem.altWords
          .map((w) => normalizeSpoken(w))
          .filter(Boolean);
        return spokenList.some((raw) => {
          const clean = normalizeSpoken(raw);
          return targets.some((t) => clean === t || clean.includes(t) || (clean.length >= 3 && t.includes(clean)));
        });
      }

      function listenForQuizAnswer() {
        if (!currentQuizItem || !quizModal.classList.contains('visible')) return;
        quizMicBtn.classList.add('listening');
        startVoiceListener({
          onStatusText: (txt) => {
            quizHeardText.textContent = txt;
          },
          onResultText: (transcript, alternatives) => {
            if (!currentQuizItem) return;
            const matched = doesSpokenMatchQuiz([transcript, ...alternatives], currentQuizItem);
            if (matched) {
              quizWrongAttempts = 0;
              quizHeardText.textContent = `🎉 ${currentQuizItem.yesSpeech}`;
              spawnFireworksBurst(width * 0.5, height * 0.45, 48);
              audio.speakPhrase(currentQuizItem.yesSpeech, true, currentLang, currentQuizItem.yesFb, () => {
                if (quizModal.classList.contains('visible')) {
                  setTimeout(() => loadNewQuizQuestion(), 650);
                }
              });
            } else {
              quizWrongAttempts += 1;
              if (quizWrongAttempts >= 2) {
                quizHeardText.textContent = `💡 ${currentQuizItem.word}`;
                audio.speakPhrase(currentQuizItem.revealSpeech, true, currentLang, currentQuizItem.revealFb);
              } else {
                quizHeardText.textContent = `🤔 "${transcript}" — ${currentQuizItem.question}`;
                audio.speakPhrase(currentQuizItem.trySpeech, true, currentLang, currentQuizItem.tryFb, () => {
                  if (quizModal.classList.contains('visible')) {
                    listenForQuizAnswer();
                  }
                });
              }
            }
          }
        });
      }

      // Hold-for-2-seconds Parent Lock
      let lockHoldTimer = null;
      let lockHoldStart = 0;
      const LOCK_HOLD_MS = 2000;

      function updateLockProgress() {
        if (!lockHoldStart) return;
        const elapsed = performance.now() - lockHoldStart;
        const pct = Math.min(100, (elapsed / LOCK_HOLD_MS) * 100);
        lockProgress.style.width = `${pct}%`;
        if (elapsed >= LOCK_HOLD_MS) {
          controlsLocked = !controlsLocked;
          lockLabel.textContent = controlsLocked ? '🔒' : '🔓';
          document.querySelectorAll('.lockable').forEach((el) => {
            el.classList.toggle('locked-btn', controlsLocked);
          });
          cancelLockHold();
          return;
        }
        lockHoldTimer = requestAnimationFrame(updateLockProgress);
      }

      function cancelLockHold() {
        lockHoldStart = 0;
        if (lockHoldTimer) cancelAnimationFrame(lockHoldTimer);
        lockHoldTimer = null;
        lockProgress.style.width = '0%';
      }

      lockBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        lockHoldStart = performance.now();
        lockHoldTimer = requestAnimationFrame(updateLockProgress);
      });
      lockBtn.addEventListener('pointerup', cancelLockHold);
      lockBtn.addEventListener('pointerleave', cancelLockHold);
      lockBtn.addEventListener('pointercancel', cancelLockHold);

      // ------------------------------------------------------------------------
      // 7. MAIN ANIMATION LOOP
      // ------------------------------------------------------------------------
      let lastTime = performance.now();
      let spawnTimer = 0;
      let started = false;

      function animate(now) {
        if ((window.innerWidth > 0 && window.innerWidth !== width) || (window.innerHeight > 0 && window.innerHeight !== height)) {
          resizeCanvas();
          if (balloons.length === 0) {
            for (let i = 0; i < 4; i++) {
              spawnBalloon(height * (0.35 + i * 0.16));
            }
          }
        }
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const time = now / 1000;

        ctx.clearRect(0, 0, width, height);

        // Soft drifting background clouds
        clouds.forEach((c) => {
          c.x += c.speed * dt;
          if (c.x - 90 > width) c.x = -90;
          drawCloud(c);
        });

        // Spawn gentle stream of balloons
        spawnTimer += dt;
        const maxBalloons = width < 600 ? 6 : 8;
        if (balloons.length < maxBalloons && spawnTimer >= 0.85) {
          spawnBalloon();
          spawnTimer = 0;
        }

        // Update & draw balloons
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          b.y -= b.speedY * speedMultiplier * dt;
          b.x = b.baseX + Math.sin(time * b.swayFreq + b.phase) * b.swayAmp;
          if (b.wobbleTime > 0) {
            b.wobbleTime = Math.max(0, b.wobbleTime - dt * 1.8);
          }

          if (b.y + b.radius * 1.8 < -40) {
            balloons.splice(i, 1);
            continue;
          }
          drawBalloon(b, time);
        }

        // Update & draw Shooter projectiles + launcher
        if (playStyle === 'SHOOT') {
          for (let i = projectiles.length - 1; i >= 0; i--) {
            const proj = projectiles[i];
            proj.x += proj.vx * dt;
            proj.y += proj.vy * dt;
            proj.spin += 10 * dt;

            if (proj.y < -40 || proj.x < -40 || proj.x > width + 40) {
              projectiles.splice(i, 1);
              continue;
            }

            // Check collision with any balloon
            let hitBalloon = false;
            for (let j = balloons.length - 1; j >= 0; j--) {
              const b = balloons[j];
              const dx = proj.x - b.x;
              const dy = proj.y - b.y;
              if (dx * dx + dy * dy <= (b.radius * 1.15 + proj.radius) ** 2) {
                balloons.splice(j, 1);
                projectiles.splice(i, 1);
                triggerBalloonPop(b);
                hitBalloon = true;
                break;
              }
            }
            if (hitBalloon) continue;

            // Draw glowing shooting star dart
            ctx.save();
            ctx.translate(proj.x, proj.y);
            ctx.rotate(proj.spin);
            ctx.font = '32px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🌟', 0, 0);
            ctx.restore();
          }
          drawLauncher();
        }

        // Draw Talk-Back speech bubbles above tickled balloons
        drawSpeechBubbles(dt);

        // Update & draw expanding pop rings
        for (let i = popRings.length - 1; i >= 0; i--) {
          const ring = popRings[i];
          ring.age += dt;
          if (ring.age >= ring.duration) {
            popRings.splice(i, 1);
            continue;
          }
          const t = ring.age / ring.duration;
          const curR = ring.r + (ring.maxR - ring.r) * t;
          ctx.save();
          ctx.globalAlpha = 1 - t;
          ctx.strokeStyle = ring.color;
          ctx.lineWidth = 6 * (1 - t);
          ctx.beginPath();
          ctx.arc(ring.x, ring.y, curR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Update & draw confetti particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.age += dt;
          if (p.age >= p.duration) {
            particles.splice(i, 1);
            continue;
          }
          p.vy += 420 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          const alpha = 1 - p.age / p.duration;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Update & draw celebratory letter/object flashcard callouts
        for (let i = popCallouts.length - 1; i >= 0; i--) {
          const c = popCallouts[i];
          c.age += dt;
          if (c.age >= c.duration) {
            popCallouts.splice(i, 1);
            continue;
          }

          const progress = c.age / c.duration;
          let scale = 1;
          if (progress < 0.16) {
            const t = progress / 0.16;
            scale = 0.35 + Math.sin(t * Math.PI * 0.65) * 0.85;
          } else {
            scale = 1.05 - (progress - 0.16) * 0.08;
          }
          const alpha = progress > 0.78 ? Math.max(0, 1 - (progress - 0.78) / 0.22) : 1;
          const offsetY = -progress * 26;
          const cardW = Math.min(width * 0.84, Math.max(270, Math.min(width, height) * 0.54));
          const cardH = Math.min(height * 0.62, Math.max(250, Math.min(width, height) * 0.48));
          const cornerR = 36;

          ctx.save();
          ctx.translate(c.x, c.y + offsetY);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;

          // Soft drop shadow behind the big picture flashcard
          ctx.save();
          ctx.shadowColor = 'rgba(15, 23, 42, 0.24)';
          ctx.shadowBlur = 28;
          ctx.shadowOffsetY = 12;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, cornerR);
          ctx.fill();
          ctx.restore();

          ctx.lineWidth = 10;
          ctx.strokeStyle = c.color;
          ctx.beginPath();
          ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, cornerR);
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          if (c.char) {
            // Top-left colored corner badge for the letter/digit so the big picture gets center stage
            const badgeR = Math.round(cardH * 0.17);
            const badgeX = -cardW / 2 + badgeR + 18;
            const badgeY = -cardH / 2 + badgeR + 18;
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
            ctx.fill();

            const letterFontSize = Math.round(badgeR * 1.15);
            ctx.font = `900 ${letterFontSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(c.char, badgeX, badgeY + 2);

            if (c.item && c.item.emoji) {
              const isMathGroup = c.item.emoji.includes('+');
              const emojiFontSize = isMathGroup
                ? Math.max(28, Math.round(cardH * 0.24))
                : Math.round(cardH * 0.48);
              ctx.font = `${emojiFontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
              ctx.fillText(c.item.emoji, 0, -cardH * 0.02, cardW - 36);
            }
          } else if (c.item && c.item.emoji) {
            const emojiFontSize = Math.round(cardH * 0.52);
            ctx.font = `${emojiFontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.fillText(c.item.emoji, 0, -cardH * 0.06);
          }

          if (c.item && c.item.word) {
            const labelText = /^[a-zA-Z0-9\s-]+$/.test(c.item.word) ? c.item.word.toUpperCase() : c.item.word;
            const wordFontSize = Math.max(24, Math.round(cardH * 0.15));
            ctx.font = `900 ${wordFontSize}px "Noto Nastaliq Urdu", "Amiri", "Tahoma", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = '#1E293B';
            ctx.fillText(labelText, 0, cardH * 0.34, cardW - 32);
          }

          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      function startGame() {
        resizeCanvas();
        if (started) return;
        started = true;
        for (let i = 0; i < 4; i++) {
          spawnBalloon(height * (0.35 + i * 0.16));
        }
        lastTime = performance.now();
        requestAnimationFrame(animate);
      }

      startGame();
      window.addEventListener('load', startGame);
      setTimeout(startGame, 120);
    })();
  </script>
</body>
</html>
