name: Build Offline Kids APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Capacitor Android Project with Native Voice
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6 @capacitor-community/speech-recognition@6
          npx cap init "Balloon Pop" com.kids.balloonpop --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" \/><\/intent><intent><action android:name="android.speech.RecognitionService" \/><\/intent><\/queries>\n    <application/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Ad-Free APK
        uses: actions/upload-artifact@v4
        with:
          name: Balloon-Pop-AdFree-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
