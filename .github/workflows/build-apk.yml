name: Build Offline Kids APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Voice Plugins
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6 @capacitor-community/speech-recognition@6 --legacy-peer-deps
          npx cap init "Balloon Pop" com.kids.balloonpop --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add Mic & TTS Permissions to AndroidManifest
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()
          perms = """    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
              </queries>
          """
          xml = xml.replace("<application", perms + "    <application", 1)
          with open(path, "w") as f:
              f.write(xml)
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Ad-Free APK
        uses: actions/upload-artifact@v4
        with:
          name: Balloon-Pop-AdFree-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
